<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 8px; text-align: left; }
        form { margin-bottom: 20px; }
    </style>
</head>
<body>
<h1>Contacts</h1>
<form id="contact-form">
    <input type="hidden" id="contact-id">
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="phone" placeholder="Phone" required>
    <button type="submit">Save</button>
</form>
<table id="contacts-table">
    <thead>
        <tr><th>Name</th><th>Phone</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
</table>
<script>
async function loadContacts() {
    const res = await fetch('/contacts');
    const contacts = await res.json();
    const tbody = document.querySelector('#contacts-table tbody');
    tbody.innerHTML = '';
    contacts.forEach(c => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${c.name}</td><td>${c.phone}</td><td>
            <button onclick="editContact(${c.id}, '${c.name}', '${c.phone}')">Edit</button>
            <button onclick="deleteContact(${c.id})">Delete</button>
        </td>`;
        tbody.appendChild(row);
    });
}

async function deleteContact(id) {
    await fetch(`/contacts/${id}`, { method: 'DELETE' });
    loadContacts();
}

function editContact(id, name, phone) {
    document.getElementById('contact-id').value = id;
    document.getElementById('name').value = name;
    document.getElementById('phone').value = phone;
}

const form = document.getElementById('contact-form');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('contact-id').value;
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const payload = { name, phone };
    if (id) {
        await fetch(`/contacts/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    } else {
        await fetch('/contacts', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    }
    form.reset();
    loadContacts();
});

loadContacts();
</script>
</body>
</html>
